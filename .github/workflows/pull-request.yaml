name: Pull Request Workflow

# Runs on every pull request. This package has no OSP dependencies and no
# `Remotes:` field. If one is added, a development version installs it from
# GitHub through `Remotes`, and release-pr moves it to the OSP R-universe.
# setup-r-env (used by test coverage and pkgdown) fails when the dependency
# fields do not match the Version and explains the fix.

on:
  pull_request:

permissions: read-all

jobs:
  R-CMD-Check:
    uses: ./.github/workflows/R-CMD-check.yaml

  test-coverage:
    if: ${{ !cancelled() }}
    needs: [R-CMD-Check]
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/test-coverage.yaml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pkgdown:
    if: ${{ !cancelled() }}
    needs: [R-CMD-Check]
    permissions:
      contents: write # required by the pkgdown reusable workflow (no deploy on PRs)
      pull-requests: read # the workflow's check-changes job reads PR file changes
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
