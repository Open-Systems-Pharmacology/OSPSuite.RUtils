name: Pull Request Workflow

# Runs on every pull request. sync-remotes pins/unpins `Remotes:` in DESCRIPTION
# to match the package Version (plain Remotes for a development version,
# `@*release` for a release version) and commits the fix to the PR branch; the
# checks then run on that synced tree. This package has no OSP dependencies and
# no `Remotes:` field, so the sync is a no-op today; it is wired in so a future
# OSP dependency follows the same rule as the other OSP packages.

on:
  pull_request:

permissions: read-all

jobs:
  sync-remotes:
    permissions:
      contents: write # commits the synced Remotes back to the PR branch
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/sync-remotes.yaml@main
    secrets: inherit

  R-CMD-Check:
    needs: [sync-remotes]
    if: ${{ !cancelled() && needs.sync-remotes.result != 'failure' }} # a skipped fork-PR sync must not block the check, but a failure should
    uses: ./.github/workflows/R-CMD-check.yaml

  test-coverage:
    if: ${{ !cancelled() }}
    needs: [R-CMD-Check]
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/test-coverage.yaml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pkgdown:
    if: ${{ !cancelled() }}
    needs: [R-CMD-Check]
    permissions:
      contents: write # required by the pkgdown reusable workflow (no deploy on PRs)
      pull-requests: read # the workflow's check-changes job reads PR file changes
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
